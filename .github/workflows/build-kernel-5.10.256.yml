name: Build GKI Kernel 5.10.256 (Android 12)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version (e.g., 256)'
        required: false
        default: '256'
      ksu_variant:
        description: 'KernelSU variant (None, Official, ReSukiSU)'
        required: true
        default: 'None'
        type: choice
        options:
          - None
          - Official
          - ReSukiSU
      ksu_branch:
        description: 'KernelSU branch'
        required: false
        default: 'Stable(标准)'
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
      use_zram:
        description: 'Enable ZRAM LZ4 enhancement'
        required: false
        default: false
        type: boolean
      droidspaces:
        description: 'Droidspaces slot (off, 678, 123, 345)'
        required: false
        default: 'off'
        type: choice
        options:
          - off
          - 678
          - 123
          - 345
      use_rekernel:
        description: 'Enable Re-Kernel driver'
        required: false
        default: false
        type: boolean
      cve_patch:
        description: 'Apply CVE-2026-43499 rtmutex fix'
        required: false
        default: false
        type: boolean
      custom_version:
        description: 'Custom kernel version suffix (optional)'
        required: false
        default: ''

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    name: Build Kernel 5.10.${{ inputs.kernel_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          repository: 404-GCross/Droidspaces_GKI_Buildin_Local
          path: build-scripts

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git curl make gcc g++ build-essential libssl-dev \
            bison flex libelf-dev dwarves ccache python3 \
            clang lld bc rsync cpio perl patch zip gawk \
            zstd

      - name: Setup ccache
        run: |
          ccache --version
          ccache --max-size=5G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Download kernel source 5.10.${{ github.event.inputs.kernel_version }}
        id: download_source
        run: |
          set -euo pipefail
          SUB_LEVEL="${{ inputs.kernel_version }}"
          
          # Release tag containing android12-5.10-256
          RELEASE_TAG="all-kernel-sources-20260608-27112872553"
          REPO="404-GCross/GKI-Kernel-Source_Fetch"
          BASE_RAW="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"
          
          ARCHIVE_NAME="kernel-source-android12-5.10-${SUB_LEVEL}.tar.gz"
          SHA_FILE="${ARCHIVE_NAME}.sha256"
          
          echo "Downloading from: ${BASE_RAW}"
          
          # Download SHA256
          curl -fSL -o "${SHA_FILE}" "${BASE_RAW}/${SHA_FILE}"
          echo "SHA256: $(cat ${SHA_FILE})"
          
          # Download parts (partaa, partab, etc.)
          PARTS=()
          if curl -fSL -o "${ARCHIVE_NAME}.partaa" "${BASE_RAW}/${ARCHIVE_NAME}.partaa"; then
            PARTS+=("${ARCHIVE_NAME}.partaa")
            echo "Downloaded partaa"
          fi
          if curl -fSL -o "${ARCHIVE_NAME}.partab" "${BASE_RAW}/${ARCHIVE_NAME}.partab"; then
            PARTS+=("${ARCHIVE_NAME}.partab")
            echo "Downloaded partab"
          fi
          
          if [ ${#PARTS[@]} -eq 0 ]; then
            echo "ERROR: Could not find kernel source parts!"
            exit 1
          fi
          
          # Merge parts and verify
          cat "${PARTS[@]}" > "${ARCHIVE_NAME}"
          sha256sum -c "${SHA_FILE}" --quiet || {
            echo "ERROR: SHA256 verification failed!"
            exit 1
          }
          
          # Extract
          tar -xzf "${ARCHIVE_NAME}"
          
          SOURCE_DIR="kernel-source-android12-5.10-${SUB_LEVEL}"
          echo "kernel_source=${PWD}/${SOURCE_DIR}" >> $GITHUB_OUTPUT
          echo "Kernel source downloaded and extracted to: ${SOURCE_DIR}"

      - name: Configure build
        run: |
          cd build-scripts
          
          # Set up configuration for 5.10.256
          cat > .build_config << EOF
# GKI 编译配置 - $(date)
APP_LANG=zh
ANDROID_VERSION=android12
KERNEL_VERSION=5.10
SUB_LEVEL=${{ github.event.inputs.kernel_version }}
OS_PATCH_LEVEL=2026-07
REVISION=
KSU_VARIANT=${{ github.event.inputs.ksu_variant }}
KSU_BRANCH=${{ github.event.inputs.ksu_branch }}
CUSTOM_VERSION=${{ github.event.inputs.custom_version }}
BUILD_TIME=
USE_ZRAM=${{ github.event.inputs.use_zram }}
USE_KPM=disabled
USE_REKERNEL=${{ github.event.inputs.use_rekernel }}
CVE_2026_43499_PATCH=${{ github.event.inputs.cve_patch }}
DROIDSPACES=${{ github.event.inputs.droidspaces }}
KERNEL_SOURCE=${{ steps.download_source.outputs.kernel_source }}
OUTPUT_DIR=${{ github.workspace }}/build/out
PACKAGE_BOOT=true
EOF
          
          cat .build_config

      - name: Build kernel
        run: |
          cd build-scripts
          chmod +x build_kernel.sh
          
          # The script will read .build_config and build automatically
          ./build_kernel.sh --quick
          
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-5.10-${{ inputs.kernel_version }}-${{ inputs.ksu_variant }}-${{ inputs.droidspaces }}
          path: |
            build-scripts/build/out/*.zip
            build-scripts/build/out/Image
            build-scripts/build/out/patch-rejects/
          retention-days: 30

      - name: Create release (on success)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-5.10-${{ inputs.kernel_version }}-${{ github.run_number }}
          name: "GKI 5.10.${{ inputs.kernel_version }} (Android 12)"
          body: |
            ## GKI Kernel Build

            - **Android Version**: 12
            - **Kernel Version**: 5.10.${{ inputs.kernel_version }}
            - **Patch Level**: 2026-07
            - **KSU Variant**: ${{ inputs.ksu_variant }}
            - **KSU Branch**: ${{ inputs.ksu_branch }}
            - **ZRAM LZ4**: ${{ inputs.use_zram }}
            - **Droidspaces**: ${{ inputs.droidspaces }}
            - **Re-Kernel**: ${{ inputs.use_rekernel }}
            - **CVE-2026-43499 Patch**: ${{ inputs.cve_patch }}
            - **Custom Version**: ${{ inputs.custom_version || 'default' }}

            Built on: ${{ github.run_id }}
          files: |
            build-scripts/build/out/*.zip
            build-scripts/build/out/Image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
